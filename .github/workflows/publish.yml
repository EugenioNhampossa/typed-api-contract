name: Publish

on:
  push:
    tags:
      - "v*"

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      # Trusted Publishing requires npm >= 11.5.1 (Node 20 ships npm 10).
      - run: npm install -g npm@^11.5.1

      - run: pnpm install --frozen-lockfile
      - run: pnpm type-check
      - run: pnpm test
      - run: pnpm test:types
      - run: pnpm test:inference-budget
      - run: pnpm build
      - run: pnpm pack:check
      - run: npm publish --access public --provenance
